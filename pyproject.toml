[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-operations-lab"
version = "0.1.0"
description = "Laboratório independente de operação controlada de LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matheus Sousa" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "opentelemetry-sdk>=1.28,<2",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.6,<3",
  "structlog>=24.4,<27",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
langfuse = ["langfuse>=4,<5"]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
llm-lab-demo = "llm_operations_lab.demo:main"
llm-lab-eval = "llm_operations_lab.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_operations_lab"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

